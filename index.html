
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UStore4U Android App</title>
  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      background: #f5f5f5;
      color: #171717;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 400px;
      margin: auto;
      padding: 35px 25px;
      background: white;
      border-radius: 18px;
    }
    .button {
      display: inline-block;
      background: #171717;
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>UStore4U</h1>
    <p>Shop your favourite watches.</p>
    <p>Get the official UStore4U Android app.</p>
    <a class="button" href="https://ustore4u.com/">
      Visit Our Store
    </a>
    <p>Android app download coming soon.</p>
  </div>
</body>
</html>
